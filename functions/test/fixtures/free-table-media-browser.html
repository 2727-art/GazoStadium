<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自由卓 画像送受信のブラウザー検証</title>
<style>body{font:16px system-ui;max-width:900px;margin:32px auto;padding:0 16px;background:#f5f7fa;color:#142030}button{padding:12px 20px}pre{white-space:pre-wrap;background:white;padding:16px}img{width:192px;height:128px;object-fit:contain;background:white;margin:8px}figure{display:inline-block;margin:0}figcaption{text-align:center}</style>
<h1>自由卓 画像送受信のブラウザー検証</h1>
<p>合成画像を同一ブラウザー内の2つの WebRTC 接続間で転送します。Firebaseや外部の対戦相手には接続しません。</p>
<button id="run">PNG・JPEG・WebPを検証</button>
<p id="status" role="status">準備完了</p>
<div id="images"></div>
<pre id="results">未実行</pre>
<script type="module">
import * as media from "/free-table-media.mjs?v=player-bugfix-browser-v1";

const button = document.querySelector("#run");
const status = document.querySelector("#status");
const output = document.querySelector("#results");
const images = document.querySelector("#images");
const check = (condition, message) => { if (!condition) throw new Error(message); };
const deadline = async (promise, ms = 15000) => {
  let timer;
  try { return await Promise.race([promise, new Promise((_, reject) => { timer = setTimeout(() => reject(new Error("検証の制限時間を超えました")), ms); })]); }
  finally { clearTimeout(timer); }
};
const once = (target, event) => new Promise(resolve => target.addEventListener(event, resolve, { once: true }));
const hash = async buffer => [...new Uint8Array(await crypto.subtle.digest("SHA-256", buffer))].map(byte => byte.toString(16).padStart(2, "0")).join("");
const resources = [];

async function peerPair() {
  const first = new RTCPeerConnection({ iceServers: [] });
  const second = new RTCPeerConnection({ iceServers: [] });
  let sender;
  let receiver;
  try {
    const offerCandidates = [];
    const answerCandidates = [];
    first.onicecandidate = event => { if (event.candidate) offerCandidates.push(event.candidate); };
    second.onicecandidate = event => { if (event.candidate) answerCandidates.push(event.candidate); };
    sender = first.createDataChannel(media.FREE_TABLE_MEDIA_CHANNEL_LABEL, { ordered: true });
    const receiverReady = new Promise(resolve => { second.ondatachannel = event => { receiver = event.channel; receiver.binaryType = "arraybuffer"; resolve(receiver); }; });
    const senderOpen = once(sender, "open");
    await first.setLocalDescription(await first.createOffer());
    await second.setRemoteDescription(first.localDescription);
    await second.setLocalDescription(await second.createAnswer());
    await first.setRemoteDescription(second.localDescription);
    await deadline(Promise.all([first, second].map(peer => peer.iceGatheringState === "complete" ? undefined : new Promise(resolve => {
      const listener = () => { if (peer.iceGatheringState === "complete") { peer.removeEventListener("icegatheringstatechange", listener); resolve(); } };
      peer.addEventListener("icegatheringstatechange", listener);
      listener();
    }))));
    await Promise.all(offerCandidates.map(candidate => second.addIceCandidate(candidate)));
    await Promise.all(answerCandidates.map(candidate => first.addIceCandidate(candidate)));
    await deadline(Promise.all([receiverReady, senderOpen]));
    return { sender, receiver, close() { sender.close(); receiver.close(); first.close(); second.close(); } };
  } catch (error) { sender?.close(); receiver?.close(); first.close(); second.close(); throw error; }
}

async function transferImage(pair, blob, requestedMime) {
  const metadata = { ownerUid: "browser-fixture-sender", sessionId: "browser-fixture-session", transferId: media.createFreeTableMediaTransferId() };
  const asset = { kind: "image", blob, mime: blob.type, duration: 0 };
  const local = await media.createLocalFreeTableMediaResource(asset, metadata);
  resources.push(local);
  const outgoing = await media.createOutgoingFreeTableMediaTransfer(asset, metadata);
  let incoming;
  let chain = Promise.resolve();
  let finish;
  let fail;
  const received = new Promise((resolve, reject) => { finish = resolve; fail = reject; });
  const listener = event => {
    chain = chain.then(async () => {
      if (typeof event.data !== "string") { await media.appendIncomingFreeTableMediaChunk(incoming, event.data); return; }
      const message = JSON.parse(event.data);
      if (message.type === "free-table-media-start") {
        incoming = media.createIncomingFreeTableMediaTransfer(message, { expectedOwnerUid: metadata.ownerUid, expectedSessionId: metadata.sessionId });
      } else if (message.type === "free-table-media-end") {
        finish(await media.finishIncomingFreeTableMediaTransfer(incoming, message));
      }
    }).catch(fail);
  };
  pair.receiver.addEventListener("message", listener);
  let receivedResource;
  try {
    await media.sendFreeTableMedia(pair.sender, asset, metadata, { peerImageMimes: pair.peerImageMimes });
    receivedResource = await deadline(received);
    resources.push(receivedResource);
  } finally { pair.receiver.removeEventListener("message", listener); }
  const sentHash = await hash(outgoing.buffer);
  const receivedHash = await hash(await receivedResource.blob.arrayBuffer());
  check(sentHash === receivedHash, "送受信したバイトが一致しません");
  check(receivedResource.mime === blob.type, "実際の画像形式が保持されていません");
  const img = new Image();
  img.src = receivedResource.url;
  await deadline(img.decode());
  check(img.naturalWidth === 96 && img.naturalHeight === 64, "受信画像の寸法が違います");
  const figure = document.createElement("figure");
  const caption = document.createElement("figcaption");
  caption.textContent = `${blob.type} 受信成功`;
  figure.append(img, caption);
  images.append(figure);
  return { requestedMime, actualMime: blob.type, sentBytes: outgoing.buffer.byteLength, receivedBytes: receivedResource.size, sha256: sentHash, decodedWidth: img.naturalWidth, decodedHeight: img.naturalHeight, pass: true };
}

button.addEventListener("click", async () => {
  button.disabled = true;
  resources.splice(0).forEach(resource => media.releaseFreeTableMediaResource(resource));
  images.replaceChildren();
  status.textContent = "検証中";
  const result = { userAgent: navigator.userAgent, startedAt: new Date().toISOString(), transport: "two RTCPeerConnection instances, local ICE only", cases: [], pass: false };
  let pair;
  try {
    pair = await peerPair();
    const peerCapabilities = media.freeTableMediaCapabilitiesMessage({ ownerUid: "browser-fixture-receiver", sessionId: "browser-fixture-session" });
    const receivedCapabilities = once(pair.sender, "message");
    pair.receiver.send(JSON.stringify(peerCapabilities));
    const capabilitiesEvent = await deadline(receivedCapabilities);
    pair.peerImageMimes = media.readFreeTableMediaCapabilities(JSON.parse(capabilitiesEvent.data), { expectedOwnerUid: "browser-fixture-receiver", expectedSessionId: "browser-fixture-session" });
    result.peerImageMimes = pair.peerImageMimes;
    const canvas = document.createElement("canvas");
    canvas.width = 96; canvas.height = 64;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#33aaff"; ctx.fillRect(0, 0, 96, 64);
    ctx.fillStyle = "#ff8844"; ctx.fillRect(16, 16, 48, 32);
    for (const mime of ["image/png", "image/jpeg", "image/webp"]) {
      const blob = await new Promise(resolve => canvas.toBlob(resolve, mime, 0.8));
      check(blob, "Canvasが画像を生成できませんでした");
      result.cases.push(await transferImage(pair, blob, mime));
    }
    result.pass = true;
    status.textContent = "PASS: 3形式すべて転送・実データ一致・画像表示成功";
  } catch (error) { result.error = error.message; status.textContent = "FAIL: " + error.message; }
  finally {
    pair?.close();
    result.finishedAt = new Date().toISOString();
    output.textContent = JSON.stringify(result, null, 2);
    button.disabled = false;
  }
});
window.addEventListener("pagehide", () => resources.splice(0).forEach(resource => media.releaseFreeTableMediaResource(resource)));
</script>
</html>
